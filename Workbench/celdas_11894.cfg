<!--
Example celdas200 XML configuration files.

The file is free form, as long as it is a valid xml file.

Keys are specified with the <add/> element. All the other element are
use to define section and subsections. There is no limit to the depth
of the tree other than the API is limited to a key of 255 characters
(IsaGRAF MAX string size).


The entry below can be retrive using the following key with the API:

"ConfigurationSettings.TSCP700.ETC_NUMBER_PROBE".
-->


<ConfigurationSettings>

  <RESSOURCE>
	
	<add key="NIDAQ_DISABLED" value="false"/>
	<add key="SERIAL_DISABLED" value="false"/>
	<add key="SERIAL_ARINC_DISABLED" value="true"/>
	<add key="OMNIBUSBOX_DISABLED" value="false"/>
	<add key="POWERDNA_DISABLED" value="false"/>
	<add key="UUT_CONTROLLER_DISABLED" value="false"/>
	<add key="UUT_CRUNCHER_DISABLED" value="false"/>
	<add key="USER_INTERFACE_DISABLED" value="false"/>
	<add key="SCANNIVALVE_TEMPERATURE_DISABLED" value="true"/>
	<add key="SCANNIVALVE_PRESSURE_DISABLED" value="true"/>
	<add key="SM1720_DISABLED" value="true"/>
	<add key="GALIL_CONTROLLER_DISABLED" value="true"/>
	<add key="TEXCEL_V100_DISABLED" value="true"/>
	<add key="TEXCEL_VX100_DISABLED" value="false"/>
	<add key="LOAD_BANK_CONTROLLER_DISABLED" value="true"/>
	<add key="FACILITY_CONTROLLER_DISABLED" value="true"/>
	<add key="AFDX_DISABLED" value="true"/>
	
  </RESSOURCE>

  <FACILITY>  <!-- Common to all engine -->

    	<add key="PROJECT_NUMBER" value="11894"/>             <!-- Constant value -->
	
	<add key="E_STOP_DAS_CMD_BINDING_SOURCE" value="DACN1_SERIAL_IOMGR_DOUT"/> 
	<add key="E_STOP_DAS_CMD_INDEX" value="4"/>      						<!-- Index in the DACN1_SERIAL_IOMGR_DOUT structure -->
	<add key="E_STOP_DAS_IND_BINDING_SOURCE" value="DACN1_SERIAL_IOMGR_DIN"/> 
	<add key="E_STOP_DAS_IND_INDEX" value="3"/>      						<!-- Index in the DACN1_SERIAL_IOMGR_DIN structure -->
    	<add key="FACILITY_FIRE_INDEX" value="1"/>           						<!-- Index in the DACN1_SERIAL_IOMGR_DIN structure -->

	<!--Serial Ports. Note that /dev/ser3 to /dev/ser5 are reserved for Modbus.-->

	<add key="SERIAL_PORT_NUMBER" value="5"/>							<!-- Number of Serial Ports to be Opened -->
	<add key="SERIAL_PORT_1_INDEX" value="6"/>
	<add key="SERIAL_PORT_1_NAME" value="/dev/ser6"/>
	<add key="SERIAL_PORT_1_BAUD_RATE" value="38400"/>
	<add key="SERIAL_PORT_1_DATA_BITS" value="8"/>
	<add key="SERIAL_PORT_1_PARITY" value="none"/>
	<add key="SERIAL_PORT_1_STOP_BITS" value="1"/>
	<add key="SERIAL_PORT_2_INDEX" value="7"/>
	<add key="SERIAL_PORT_2_NAME" value="/dev/ser7"/>
	<add key="SERIAL_PORT_2_BAUD_RATE" value="38400"/>
	<add key="SERIAL_PORT_2_DATA_BITS" value="8"/>
	<add key="SERIAL_PORT_2_PARITY" value="none"/>
	<add key="SERIAL_PORT_2_STOP_BITS" value="1"/>
	<add key="SERIAL_PORT_3_INDEX" value="8"/>
	<add key="SERIAL_PORT_3_NAME" value="/dev/ser8"/>
	<add key="SERIAL_PORT_3_BAUD_RATE" value="38400"/>
	<add key="SERIAL_PORT_3_DATA_BITS" value="8"/>
	<add key="SERIAL_PORT_3_PARITY" value="none"/>
	<add key="SERIAL_PORT_3_STOP_BITS" value="1"/>
	<add key="SERIAL_PORT_4_INDEX" value="9"/>
	<add key="SERIAL_PORT_4_NAME" value="/dev/ser9"/>
	<add key="SERIAL_PORT_4_BAUD_RATE" value="38400"/>
	<add key="SERIAL_PORT_4_DATA_BITS" value="8"/>
	<add key="SERIAL_PORT_4_PARITY" value="none"/>
	<add key="SERIAL_PORT_4_STOP_BITS" value="1"/>
	<add key="SERIAL_PORT_5_INDEX" value="10"/>
	<add key="SERIAL_PORT_5_NAME" value="/dev/ser10"/>
	<add key="SERIAL_PORT_5_BAUD_RATE" value="38400"/>
	<add key="SERIAL_PORT_5_DATA_BITS" value="8"/>
	<add key="SERIAL_PORT_5_PARITY" value="none"/>
	<add key="SERIAL_PORT_5_STOP_BITS" value="1"/>

  </FACILITY>
  
  <PW150A>   <!-- PW150A Engine -->

	<add key="NL_INDEX" value="2"/>       				<!-- Index in the DACN1_NIDAQ_IOMGR_F structure -->  
	<add key="NL_BINDING_SOURCE" value="DACN1_NIDAQ_IOMGR_F"/>	<!-- 43 = DACN1_NIDAQ_IOMGR_F-->           
	<add key="NL_100_RPM_CONSTANT" value="27000.0"/>   		<!-- Constant value -->
	<add key="NL_100_FREQ_CONSTANT" value="9000.0"/>  		<!-- Constant value -->

	<add key="NH_INDEX" value="1"/>       				<!-- Index in the DACN1_NIDAQ_IOMGR_F structure -->  
	<add key="NH_BINDING_SOURCE" value="DACN1_NIDAQ_IOMGR_F"/>	<!-- 43 = DACN1_NIDAQ_IOMGR_F-->           
	<add key="NH_100_RPM_CONSTANT" value="31150.0"/>   		<!-- Constant value -->
	<add key="NH_100_FREQ_CONSTANT" value="6987.0"/>  		<!-- Constant value -->

	<add key="NPT_INDEX" value="3"/>       				<!-- Index in the DACN1_NIDAQ_IOMGR_F structure -->  
	<add key="NPT_BINDING_SOURCE" value="DACN1_NIDAQ_IOMGR_F"/>	<!-- 43 = DACN1_NIDAQ_IOMGR_F-->           
	<add key="NPT_100_RPM_CONSTANT" value="17501.0"/>   		<!-- Constant value -->
	<add key="NPT_100_FREQ_CONSTANT" value="1486.0"/>  		<!-- Constant value -->

	<add key="T_INLET_PROBE_BINDING_SOURCE" value="DACN1_POWERDNA_IOMGR_T"/>
	<add key="T_INLET_NUMBER_PROBE" value="5"/>    
	<add key="T_INLET_PROBE_INDEX1" value="1"/> 
	<add key="T_INLET_PROBE_INDEX2" value="2"/> 
	<add key="T_INLET_PROBE_INDEX3" value="3"/> 
	<add key="T_INLET_PROBE_INDEX4" value="4"/> 
	<add key="T_INLET_PROBE_INDEX5" value="5"/>
		
	<add key="T_T25_PROBE_BINDING_SOURCE" value="DACN1_POWERDNA_IOMGR_T"/>
	<add key="T_T25_NUMBER_PROBE" value="3"/>    
	<add key="T_T25_PROBE_INDEX1" value="1"/> 
	<add key="T_T25_PROBE_INDEX2" value="2"/> 
	<add key="T_T25_PROBE_INDEX3" value="3"/> 

	<add key="T_T3_PROBE_BINDING_SOURCE" value="DACN1_POWERDNA_IOMGR_T"/>
	<add key="T_T3_NUMBER_PROBE" value="3"/>    
	<add key="T_T3_PROBE_INDEX1" value="1"/> 
	<add key="T_T3_PROBE_INDEX2" value="2"/> 
	<add key="T_T3_PROBE_INDEX3" value="3"/> 

	<add key="T_EGT_PROBE_BINDING_SOURCE" value="DACN1_POWERDNA_IOMGR_T"/>  
	<add key="T_EGT_NUMBER_PROBE" value="24"/>    
	<add key="T_EGT_PROBE_INDEX1" value="25"/>  
	<add key="T_EGT_PROBE_INDEX2" value="26"/>
	<add key="T_EGT_PROBE_INDEX3" value="27"/>
	<add key="T_EGT_PROBE_INDEX4" value="28"/>
	<add key="T_EGT_PROBE_INDEX5" value="29"/>
	<add key="T_EGT_PROBE_INDEX6" value="30"/>
	<add key="T_EGT_PROBE_INDEX7" value="31"/>
	<add key="T_EGT_PROBE_INDEX8" value="32"/>
	<add key="T_EGT_PROBE_INDEX9" value="33"/>
	<add key="T_EGT_PROBE_INDEX10" value="34"/>
	<add key="T_EGT_PROBE_INDEX11" value="35"/>
	<add key="T_EGT_PROBE_INDEX12" value="36"/>
	<add key="T_EGT_PROBE_INDEX13" value="37"/>
	<add key="T_EGT_PROBE_INDEX14" value="38"/>
	<add key="T_EGT_PROBE_INDEX15" value="39"/>
	<add key="T_EGT_PROBE_INDEX16" value="40"/>
	<add key="T_EGT_PROBE_INDEX17" value="41"/>
	<add key="T_EGT_PROBE_INDEX18" value="42"/>
	<add key="T_EGT_PROBE_INDEX19" value="43"/>
	<add key="T_EGT_PROBE_INDEX20" value="44"/>
	<add key="T_EGT_PROBE_INDEX21" value="45"/>
	<add key="T_EGT_PROBE_INDEX22" value="46"/>
	<add key="T_EGT_PROBE_INDEX23" value="47"/>
	<add key="T_EGT_PROBE_INDEX24" value="48"/>

	<add key="ITT_ARINC_INDEX" value="7"/>       			       <!-- Index in the DACN1_OMNIBUSBOX_IOMGR_A429IN_CHA structure -->  

	<add key="OMNIBUSBOX_CHANNEL_9"  value="CELBTI_CHCFG429_LOWSPEED"/>    <!-- CELBTI_CHCFG429_HIGHSPEED or CELBTI_CHCFG429_LOWSPEED -->
	<add key="OMNIBUSBOX_CHANNEL_10" value="CELBTI_CHCFG429_LOWSPEED"/>
	<add key="OMNIBUSBOX_CHANNEL_11" value="CELBTI_CHCFG429_LOWSPEED"/>
	<add key="OMNIBUSBOX_CHANNEL_12" value="CELBTI_CHCFG429_LOWSPEED"/>

  </PW150A>


</ConfigurationSettings>

